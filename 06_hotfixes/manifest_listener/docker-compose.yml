services:
  tester:
    build: .
    ports:
      # Host side pinned to 127.0.0.1: no auth, and it serves clinical-derived
      # audio. Drop the prefix only on a machine you trust the whole network of.
      - "127.0.0.1:5007:5000"
    environment:
      MANIFEST: dataset/fr/nemo_manifest_ordered.json
      PATH_FROM: ./export/
      PATH_TO: ./dataset/
      FLAGGED: flagged.jsonl
    volumes:
      - ./dataset:/app/dataset:ro
      - ./flagged.jsonl:/app/flagged.jsonl
    restart: unless-stopped
